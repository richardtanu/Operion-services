spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/operion}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:root}
# Local dev still defaults to the values above (unchanged behavior on this
# machine). In any deployed environment, DB_URL/DB_USERNAME/DB_PASSWORD must
# be set as real environment variables — never hardcode production DB
# credentials into this file, they'd end up in git history again.

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# BE-05 (OPERION_BE_CHANGE_QUEUE.md): adopting Flyway on a database that
# already has data/schema. baseline-on-migrate marks the current schema as
# V1 without requiring a plain-SQL dump of everything already here (the only
# existing dump is a binary pg_dump custom-format file, not usable as a
# baseline script). ddl-auto above is now "validate", confirmed live 11 Aug
# 2026 - see BE-05 for the boot-test that verified this before it was
# flipped from "update". If this fails to boot for you, the live schema has
# drifted from entity mappings since that check; do not flip back to
# "update" to make it boot - report the drift instead, see CLAUDE.md rule 3.
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

